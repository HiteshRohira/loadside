<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
<filter id="baseShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="objShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/></filter>
<clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/></linearGradient>

<linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#30333e"/><stop offset="1" stop-color="#111318"/></linearGradient>
<linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8ac2"/><stop offset="1" stop-color="#e2457e"/></linearGradient>
<linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b79bff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient>
<linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6ff"/><stop offset="1" stop-color="#3b5cff"/></linearGradient>
<linearGradient id="tileSheenC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g filter="url(#baseShadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bgC)"/></g>
<g clip-path="url(#squircle)">
  <g filter="url(#objShadow)"><rect x="380" y="236" width="380" height="380" rx="92" fill="url(#c1)"/></g>
  <rect x="380" y="236" width="380" height="380" rx="92" fill="url(#tileSheenC)"/>
  <g filter="url(#objShadow)"><rect x="322" y="298" width="380" height="380" rx="92" fill="url(#c2)"/></g>
  <rect x="322" y="298" width="380" height="380" rx="92" fill="url(#tileSheenC)"/>
  <g filter="url(#objShadow)"><rect x="264" y="360" width="400" height="400" rx="96" fill="url(#c3)"/></g>
  <rect x="264" y="360" width="400" height="400" rx="96" fill="url(#tileSheenC)"/>
  <rect x="265.5" y="361.5" width="397" height="397" rx="94.5" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
  <!-- refresh mark -->
  <g transform="translate(464 560)">
    <path d="M -108 0 A 108 108 0 1 1 -76 76" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
    <path d="M -128 -30 L -108 26 L -62 -14 Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round" transform="rotate(8 -108 0)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
</g>
</svg>

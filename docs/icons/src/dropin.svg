<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
<filter id="baseShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="objShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/></filter>
<clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/></linearGradient>

<linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfe"/><stop offset="1" stop-color="#d9dde8"/></linearGradient>
<linearGradient id="rimB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f5e"/><stop offset="0.5" stop-color="#1b1e27"/><stop offset="1" stop-color="#3a3f4d"/></linearGradient>
<linearGradient id="screenB" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<radialGradient id="screenGlowB" cx="0.35" cy="0.5" r="0.7"><stop offset="0" stop-color="#6d6bff" stop-opacity="0.55"/><stop offset="1" stop-color="#6d6bff" stop-opacity="0"/></radialGradient>
<linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7dff"/><stop offset="0.55" stop-color="#5b6cff"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="tileSheenB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="trailB" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#6d6bff" stop-opacity="0.85"/><stop offset="1" stop-color="#6d6bff" stop-opacity="0"/></linearGradient>
</defs>
<g filter="url(#baseShadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bgB)"/></g>
<g clip-path="url(#squircle)">
  <!-- phone, right of centre -->
  <g filter="url(#objShadow)"><rect x="452" y="232" width="290" height="560" rx="70" fill="url(#rimB)"/></g>
  <rect x="464" y="244" width="266" height="536" rx="60" fill="#05060a"/>
  <rect x="474" y="254" width="246" height="516" rx="51" fill="url(#screenB)"/>
  <rect x="474" y="254" width="246" height="516" rx="51" fill="url(#screenGlowB)"/>
  <rect x="560" y="272" width="74" height="22" rx="11" fill="#000"/>
  <!-- motion trail -->
  <rect x="150" y="452" width="200" height="24" rx="12" fill="url(#trailB)"/>
  <rect x="190" y="512" width="170" height="24" rx="12" fill="url(#trailB)" opacity="0.8"/>
  <rect x="160" y="572" width="190" height="24" rx="12" fill="url(#trailB)" opacity="0.55"/>
  <!-- app tile sliding in through the side -->
  <g filter="url(#objShadow)"><rect x="330" y="392" width="248" height="248" rx="60" fill="url(#tileB)"/></g>
  <rect x="330" y="392" width="248" height="248" rx="60" fill="url(#tileSheenB)"/>
  <rect x="331.5" y="393.5" width="245" height="245" rx="58.5" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
  <!-- tile glyph: download into tray -->
  <path d="M454 452 v92 M414 508 l40 40 l40 -40" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M404 584 h100" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#sheen)" opacity="0.6"/>
</g>
</svg>

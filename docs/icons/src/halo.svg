<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
<filter id="baseShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="objShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/></filter>
<clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/></linearGradient>

<linearGradient id="bgA" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#22307a"/><stop offset="1" stop-color="#090c26"/></linearGradient>
<radialGradient id="bgGlowA" cx="0.5" cy="0.52" r="0.42"><stop offset="0" stop-color="#5b4cf0" stop-opacity="0.55"/><stop offset="1" stop-color="#5b4cf0" stop-opacity="0"/></radialGradient>
<linearGradient id="ringA" x1="0.1" y1="0.9" x2="0.9" y2="0.1"><stop offset="0" stop-color="#2ee6d6"/><stop offset="0.5" stop-color="#5b8cff"/><stop offset="1" stop-color="#c46bff"/></linearGradient>
<linearGradient id="rimA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5fa"/><stop offset="0.5" stop-color="#a6abbd"/><stop offset="1" stop-color="#e3e5ee"/></linearGradient>
<linearGradient id="screenA" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#1d2a6e"/><stop offset="0.6" stop-color="#3b2a8f"/><stop offset="1" stop-color="#7b3fd6"/></linearGradient>
<linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.42" stop-color="#fff" stop-opacity="0.04"/><stop offset="0.43" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ff3e6"/><stop offset="1" stop-color="#14b8c6"/></linearGradient>
<linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7a6ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9fd0"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
<linearGradient id="t4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
</defs>
<g filter="url(#baseShadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bgA)"/></g>
<g clip-path="url(#squircle)">
  <rect x="100" y="100" width="824" height="824" fill="url(#bgGlowA)"/>
  <!-- ring glow + ring -->
  <g transform="rotate(-128 512 512)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ringA)" stroke-width="40" stroke-linecap="round" stroke-dasharray="1560 400" opacity="0.75" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ringA)" stroke-width="34" stroke-linecap="round" stroke-dasharray="1560 400"/>
  </g>
  <!-- comet head at the end of the arc -->
  <g transform="rotate(-128 512 512) rotate(297.9 512 512)">
    <circle cx="812" cy="512" r="40" fill="#e9d5ff" opacity="0.8" filter="url(#glow)"/>
    <circle cx="812" cy="512" r="24" fill="#fff"/>
  </g>
  <!-- phone -->
  <g filter="url(#objShadow)">
    <rect x="384" y="262" width="256" height="500" rx="62" fill="url(#rimA)"/>
  </g>
  <rect x="394" y="272" width="236" height="480" rx="53" fill="#0b0d18"/>
  <rect x="404" y="282" width="216" height="460" rx="45" fill="url(#screenA)"/>
  <rect x="478" y="298" width="68" height="20" rx="10" fill="#05060c"/>
  <!-- app grid -->
  <rect x="430" y="380" width="70" height="70" rx="18" fill="url(#t1)"/>
  <rect x="524" y="380" width="70" height="70" rx="18" fill="url(#t2)"/>
  <rect x="430" y="474" width="70" height="70" rx="18" fill="url(#t3)"/>
  <rect x="524" y="474" width="70" height="70" rx="18" fill="url(#t4)"/>
  <rect x="404" y="282" width="216" height="460" rx="45" fill="url(#glassA)"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
<filter id="baseShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="objShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.38"/></filter>
<clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/></linearGradient>

<filter id="aurora" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="frost" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="36"/></filter>
<clipPath id="phoneClip"><rect x="352" y="214" width="320" height="596" rx="84"/></clipPath>
<linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff" stop-opacity="0.7"/></linearGradient>
<linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0.10"/></linearGradient>
<g id="blobs">
  <rect x="0" y="0" width="1024" height="1024" fill="#2a1a7a"/>
  <circle cx="800" cy="200" r="330" fill="#ff4fa3"/>
  <circle cx="200" cy="840" r="360" fill="#12cfe0"/>
  <circle cx="240" cy="220" r="300" fill="#5b4cff"/>
  <circle cx="840" cy="860" r="320" fill="#8b5cf6"/>
</g>
</defs>
<g filter="url(#baseShadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="#2a1a7a"/></g>
<g clip-path="url(#squircle)">
  <use href="#blobs" filter="url(#aurora)"/>
  <!-- frosted glass phone: a blurrier, brighter copy of the background inside -->
  <g filter="url(#objShadow)"><rect x="352" y="214" width="320" height="596" rx="84" fill="#000" fill-opacity="0.12"/></g>
  <g clip-path="url(#phoneClip)"><use href="#blobs" filter="url(#frost)" opacity="0.9"/><rect x="352" y="214" width="320" height="596" fill="url(#glassFill)"/></g>
  <rect x="354" y="216" width="316" height="592" rx="82" fill="none" stroke="url(#glassEdge)" stroke-width="6"/>
  <rect x="366" y="228" width="292" height="568" rx="72" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M 370 330 Q 372 236 470 232" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round"/>
  <rect x="474" y="248" width="76" height="22" rx="11" fill="#fff" fill-opacity="0.55"/>
  <!-- glyph: down arrow inside a refresh ring -->
  <g transform="translate(512 512)">
    <path d="M 0 -58 v 104 M -40 8 l 40 40 l 40 -40" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 103 -60 A 120 120 0 1 1 -40 -113" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <path d="M -12 -114 L -78 -148 L -66 -76 Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
</g>
</svg>
